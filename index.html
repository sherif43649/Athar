<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أَثَر 2090 | ATHAR 2090</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #b000ff;
            --dark-bg: #05050d;
            --panel-bg: rgba(10, 15, 30, 0.85);
            --text-color: #e0f7fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(176, 0, 255, 0.15), transparent 60%),
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        #watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 3rem;
            color: rgba(0, 243, 255, 0.04);
            pointer-events: none;
            z-index: 9999;
            white-space: nowrap;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
        }

        .container {
            width: 90%;
            max-width: 450px;
            padding: 30px;
            background: var(--panel-bg);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.1);
            border-radius: 12px;
            text-align: center;
            position: relative;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-family: 'Orbitron', 'Cairo', sans-serif;
            font-size: 2.2rem;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--neon-purple);
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--neon-blue);
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(5, 10, 20, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            direction: ltr;
            text-align: center;
        }

        input:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 10px rgba(176, 0, 255, 0.5);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            box-shadow: 0 0 15px rgba(176, 0, 255, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.8);
        }

        .footer-text {
            margin-top: 20px;
            font-size: 0.75rem;
            color: rgba(224, 247, 252, 0.5);
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="watermark">ATHAR 2090 - SECURED PLATFORM</div>

    <div class="container">
        <h1>أَثَر 2090</h1>
        <div class="subtitle">CYBERPUNK EDUCATIONAL SYSTEM</div>

        <form id="loginForm">
            <div class="input-group">
                <label for="phone">رقم الهاتف المصري:</label>
                <input type="tel" id="phone" placeholder="01xxxxxxxxx" maxlength="11" required>
            </div>

            <div class="input-group">
                <label for="studentCode">كود الطالب الأكاديمي:</label>
                <input type="text" id="studentCode" placeholder="ATHAR-XXXX" required>
            </div>

            <button type="submit" class="btn">دخول المنصة 🚀</button>
        </form>

        <div class="footer-text">
            نظام حماية مشفر 2090 © جميع الحقوق محفوظة لـ ATHAR
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

            projectId: "athar-2090",
            storageBucket: "athar-2090.firebasestorage.app",
            messagingSenderId: "910820839182",
            appId: "1:910820839182:web:8bb94f0c6a68b5289c115f",
            measurementId: "G-GL2WXGCJGS"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.addEventListener('keydown', function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
                e.preventDefault();
            }
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const phone = document.getElementById('phone').value;
            const code = document.getElementById('studentCode').value;

            const egyPhoneRegex = /^01[0125][0-9]{8}$/;

            if (!egyPhoneRegex.test(phone)) {
                alert('عفواً، يرجى إدخال رقم هاتف مصري صحيح (11 رقم يبدأ بـ 01)');
                return;
            }

            alert('تم تسجيل الدخول بنجاح! مرحباً بك في بوابة ATHAR 2090');
        });
    </script>
</body>
</html>
