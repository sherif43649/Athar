<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أَثَر 2090 | ATHAR 2090</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #b000ff;
            --neon-red: #ff0055;
            --dark-bg: #05050d;
            --panel-bg: rgba(10, 15, 30, 0.9);
            --text-color: #e0f7fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(176, 0, 255, 0.15), transparent 60%),
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        #watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 3rem;
            color: rgba(0, 243, 255, 0.04);
            pointer-events: none;
            z-index: 9999;
            white-space: nowrap;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
        }

        .container {
            width: 90%;
            max-width: 450px;
            padding: 30px;
            background: var(--panel-bg);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.1);
            border-radius: 12px;
            text-align: center;
            position: relative;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-family: 'Orbitron', 'Cairo', sans-serif;
            font-size: 2.2rem;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--neon-purple);
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--neon-blue);
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(5, 10, 20, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            direction: ltr;
            text-align: center;
        }

        input:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 10px rgba(176, 0, 255, 0.5);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            box-shadow: 0 0 15px rgba(176, 0, 255, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.8);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-box {
            background: #080d1a;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 30px var(--neon-blue);
            border-radius: 12px; padding: 25px; width: 85%; max-width: 380px;
            text-align: center; transform: scale(0.8); transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-box { transform: scale(1); }

        .modal-title { font-size: 1.3rem; color: var(--neon-blue); margin-bottom: 12px; font-weight: 700; }
        .modal-message { font-size: 0.95rem; color: #d1f4ff; margin-bottom: 20px; line-height: 1.5; }
        
        .footer-text { margin-top: 20px; font-size: 0.75rem; color: rgba(224, 247, 252, 0.5); }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="watermark">ATHAR 2090 - SECURED PLATFORM</div>

    <div class="container">
        <h1>أَثَر 2090</h1>
        <div class="subtitle">CYBERPUNK EDUCATIONAL SYSTEM</div>

        <form id="loginForm">
            <div class="input-group">
                <label for="phone">رقم الهاتف المصري:</label>
                <input type="tel" id="phone" placeholder="01xxxxxxxxx" maxlength="11" required>
            </div>

            <div class="input-group">
                <label for="studentCode">كود الطالب الأكاديمي:</label>
                <input type="text" id="studentCode" placeholder="ATHAR-XXXX" required>
            </div>

            <button type="submit" class="btn">دخول المنصة 🚀</button>
        </form>

        <div class="footer-text">
            نظام حماية مشفر 2090 © جميع الحقوق محفوظة لـ ATHAR
        </div>
    </div>

    <div class="modal-overlay" id="customModal">
        <div class="modal-box" id="modalBox">
            <div class="modal-title" id="modalTitle">تنبيه النظام</div>
            <div class="modal-message" id="modalMessage">المحتوى هنا</div>
        </div>
    </div>

    <script>
        function showCustomModal(title, message, isError = false) {
            const modal = document.getElementById('customModal');
            const modalBox = document.getElementById('modalBox');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;

            if(isError) {
                modalBox.style.borderColor = 'var(--neon-red)';
                modalBox.style.boxShadow = '0 0 30px var(--neon-red)';
                document.getElementById('modalTitle').style.color = 'var(--neon-red)';
            } else {
                modalBox.style.borderColor = 'var(--neon-blue)';
                modalBox.style.boxShadow = '0 0 30px var(--neon-blue)';
                document.getElementById('modalTitle').style.color = 'var(--neon-blue)';
            }

            modal.classList.add('active');
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const phone = document.getElementById('phone').value;
            const code = document.getElementById('studentCode').value;

            const egyPhoneRegex = /^01[0125][0-9]{8}$/;

            if (!egyPhoneRegex.test(phone)) {
                showCustomModal('خطأ في التحقق ⚠️', 'يرجى إدخال رقم هاتف مصري صحيح مكون من 11 رقم.', true);
                return;
            }

            // حفظ بيانات الطالب في المتصفح
            localStorage.setItem('studentPhone', phone);
            localStorage.setItem('studentCode', code);

            showCustomModal('تم التحقق بنجاح 🚀', 'مرحباً بك في نظام ATHAR 2090. جاري توجيهك للوحة التحكم...');

            // التوجه تلقائياً إلى لوحة التحكم dashboard.html بعد ثانية واحدة
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1200);
        });
    </script>
</body>
</html>
